name = "ashare-dashboard-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 使用 3 条 Cron 表达式精准覆盖 5 个交易日档位（完全在 Cloudflare 免费版 3 条/Worker、5 条/账号 限额内）
# 所有时间均为 UTC（北京时间 CST = UTC + 8）
[triggers]
crons = [
  "15,40 1 * * 1-5",  # 北京时间 09:15、09:40（拉取前一交易日 T+1 两融全行业披露与官方流通市值校准）
  "10,40 7 * * 1-5",  # 北京时间 15:10（盘后第一时间快报）、15:40（15:30 盘后固定价格交易结束后补齐终盘成交额）
  "30 9 * * 1-5"      # 北京时间 17:30（沪深交易所盘后官方流通市值落地后最终校准）
]

[vars]
GITHUB_OWNER = "felixzhangyc-lgtm"
GITHUB_REPO = "ashare-dashboard"
GITHUB_WORKFLOW = "update-charts.yml"
GITHUB_REF = "main"
