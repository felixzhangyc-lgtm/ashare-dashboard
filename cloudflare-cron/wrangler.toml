name = "ashare-dashboard-cron"
main = "src/index.js"
compatibility_date = "2026-01-01"

# 使用 3 条 Cron 表达式精准覆盖 4 个交易日档位（完全在 Cloudflare 免费版 3 条/Worker、5 条/账号 限额内）
# 注意：Cloudflare Cron 的数字星期为 1=周日..7=周六（与 Linux 的 1-5 不同），务必使用 MON-FRI 避免周五漏触发！
# 所有时间均为 UTC（北京时间 CST = UTC + 8）
[triggers]
crons = [
  "15,40 1 * * MON-FRI",  # 北京时间 09:15、09:40（拉取前一交易日 T+1 两融全行业披露与官方流通市值校准）
  "10 7 * * MON-FRI",     # 北京时间 15:10（15:00 收盘后第一时间快报）
  "30 9 * * MON-FRI"      # 北京时间 17:30（沪深交易所盘后官方流通市值落地后最终校准）
]

[vars]
GITHUB_OWNER = "felixzhangyc-lgtm"
GITHUB_REPO = "ashare-dashboard"
GITHUB_WORKFLOW = "update-charts.yml"
GITHUB_REF = "main"
