name: Update A-Share Charts & Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'outputs/dashboard.html'
      - 'outputs/assets/**'
      - '.github/workflows/update-charts.yml'
  schedule:
    # 主要准点档位（09:15 / 09:40 / 15:10 / 15:40 / 17:30）已交由 Cloudflare Workers Cron (cloudflare-cron/) 触发
    # 此处仅保留北京时间周一至周五 23:00（UTC 15:00）一档夜间兜底，防止外部 Token 过期或异常时断更
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '执行模式：everything（抓最新数据并更新看板）或 dashboard（仅重生成看板）'
        required: true
        default: 'everything'
        type: choice
        options:
          - everything
          - dashboard
      source:
        description: '触发来源（manual 手动 / cloudflare-cron 云端准点定时）'
        required: false
        default: 'manual'
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      has_failures: ${{ steps.fetch.outputs.has_failures }}
      ok_count: ${{ steps.fetch.outputs.ok_count }}
      fail_count: ${{ steps.fetch.outputs.fail_count }}
      failed_summary: ${{ steps.fetch.outputs.failed_summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Chinese fonts for SkiaSharp PNG rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fontconfig fonts-noto-cjk
          fc-cache -f

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build MarketCharts
        run: dotnet build MarketCharts -c Release --nologo

      - name: Fetch market data & regenerate dashboard
        id: fetch
        env:
          RUN_MODE: ${{ inputs.mode || 'everything' }}
          DISPATCH_SOURCE: ${{ inputs.source || 'manual' }}
        run: |
          set -o pipefail
          DLL="MarketCharts/bin/Release/net11.0/MarketCharts.dll"
          if [ "$RUN_MODE" = "dashboard" ]; then
            dotnet "$DLL" dashboard 2>&1 | tee ci-run.log
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
            echo "ok_count=0" >> "$GITHUB_OUTPUT"
            echo "fail_count=0" >> "$GITHUB_OUTPUT"
            echo "failed_summary=" >> "$GITHUB_OUTPUT"
          else
            dotnet "$DLL" ci 2>&1 | tee ci-run.log
          fi

      - name: Upload 30-day raw run log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: |
            ci-run.log
            outputs/run_history.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit updated CSV / PNG / dashboard / run history to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M CST')
            git commit -m "chore: update A-share charts ($TS) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

  deploy:
    needs: update
    if: always() && (github.event_name == 'push' || needs.update.result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Stage GitHub Pages site
        run: |
          mkdir -p _site/assets
          cp outputs/dashboard.html _site/index.html
          cp -r outputs/assets/* _site/assets/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for artifact metadata indexing
        run: sleep 6

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying GitHub Pages deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 12

      - name: Retry Deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

  alert:
    needs: [update, deploy]
    if: always() && github.event_name != 'push' && (needs.update.outputs.has_failures == 'true' || needs.update.result == 'failure' || needs.deploy.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Emit failure alert to trigger GitHub email notification
        env:
          UPDATE_RESULT: ${{ needs.update.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          OK_COUNT: ${{ needs.update.outputs.ok_count }}
          FAIL_COUNT: ${{ needs.update.outputs.fail_count }}
          FAILED_SUMMARY: ${{ needs.update.outputs.failed_summary }}
        run: |
          {
            echo "## 🚨 A股看板更新告警"
            echo ""
            echo "- update 阶段：\`$UPDATE_RESULT\`（成功 \`$OK_COUNT\` / 失败 \`$FAIL_COUNT\`）"
            echo "- deploy 阶段：\`$DEPLOY_RESULT\`（其余正常模块已照常部署上线）"
            if [ -n "$FAILED_SUMMARY" ]; then
              echo "- 失败模块详情：$FAILED_SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=A股看板更新异常::update=$UPDATE_RESULT, deploy=$DEPLOY_RESULT | $FAILED_SUMMARY"
          exit 1
